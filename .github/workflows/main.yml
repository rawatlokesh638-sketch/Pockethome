name: Build PocketHome APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build PocketHome
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build PocketHome APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload PocketHome APK
        uses: actions/upload-artifact@v4
        with:
          name: PocketHome-debug-apk
          path: |
            app/build/outputs/apk/**/*.apk
          if-no-files-found: error
